name: Bajar assets de Poly Haven
on:
  push:
    branches: ['claude/**']
    paths: ['tools/polyhaven-wanted.json', 'tools/polyhaven.mjs']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node tools/polyhaven.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add tools/polyhaven-catalog.txt assets-raw || true
          git commit -m "Assets de Poly Haven descargados (CC0)" || exit 0
          git push
