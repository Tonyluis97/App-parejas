<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nosotros</title>
<meta name="theme-color" content="#e24d6b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Nosotros">
<!--PWA-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fff7f5; --surface:#ffffff; --surface-2:#fdeeee; --text:#2b1d22; --muted:#7d6870; --line:#f0dcdf;
  --accent:#e24d6b; --accent-2:#ff8a65; --accent-ink:#ffffff; --ok:#2e9d6a; --warn:#c77700; --bad:#c62f45;
  --bubble-me:#e24d6b; --bubble-me-ink:#fff; --bubble-you:#f6e4e7; --bubble-you-ink:#2b1d22;
  --wall:#e9d8c4; --wall-2:#d9c2a8; --floor:#9b7653; --floor-2:#7f5f41; --shadow:0 6px 24px rgba(120,40,60,.12);
  --radius:18px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1a1316; --surface:#251b1f; --surface-2:#2f2227; --text:#f6e9ec; --muted:#b39aa2; --line:#3a2a30;
    --accent:#ff6b88; --accent-2:#ff9a7a; --accent-ink:#1a1316; --ok:#5fd19b; --warn:#f2b44a; --bad:#ff7085;
    --bubble-me:#ff6b88; --bubble-me-ink:#1a1316; --bubble-you:#33252a; --bubble-you-ink:#f6e9ec;
    --wall:#3b3040; --wall-2:#2c2431; --floor:#4a3426; --floor-2:#35251b; --shadow:0 6px 24px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --bg:#1a1316; --surface:#251b1f; --surface-2:#2f2227; --text:#f6e9ec; --muted:#b39aa2; --line:#3a2a30;
  --accent:#ff6b88; --accent-2:#ff9a7a; --accent-ink:#1a1316; --ok:#5fd19b; --warn:#f2b44a; --bad:#ff7085;
  --bubble-me:#ff6b88; --bubble-me-ink:#1a1316; --bubble-you:#33252a; --bubble-you-ink:#f6e9ec;
  --wall:#3b3040; --wall-2:#2c2431; --floor:#4a3426; --floor-2:#35251b; --shadow:0 6px 24px rgba(0,0,0,.4);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font-family:Nunito,system-ui,-apple-system,sans-serif;font-size:16px;line-height:1.4;overflow-x:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
#app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
header.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:var(--bg)}
header.top h1{font-size:20px;margin:0;font-weight:800;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.iconbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:20px;background:var(--surface);box-shadow:var(--shadow)}
main{flex:1;padding:4px 16px 110px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;justify-content:center;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .in{display:flex;width:100%;max-width:560px}
nav.tabs button{flex:1;padding:10px 0 8px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--muted);font-weight:700;position:relative}
nav.tabs button .i{font-size:22px;line-height:1}
nav.tabs button.on{color:var(--accent)}
.dot{position:absolute;top:6px;left:calc(50% + 8px);min-width:18px;height:18px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font-size:11px;display:grid;place-items:center;padding:0 5px}
.card{background:var(--surface);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
.card h2{margin:0 0 8px;font-size:17px}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;gap:10px;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 16px;border-radius:14px;font-weight:800;background:var(--surface-2);color:var(--text)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.block{width:100%}
.btn:disabled{opacity:.5}
.btn.sm{padding:8px 12px;font-size:14px;border-radius:12px}
input[type=text],input[type=date],input[type=tel],textarea{width:100%;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);outline:none}
input:focus,textarea:focus{border-color:var(--accent)}
label.f{display:block;font-weight:700;font-size:14px;margin:12px 0 6px}
.hero{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;text-align:center;padding:22px 16px}
.hero .names{font-size:22px;font-weight:800}
.hero .big{font-size:44px;font-weight:800;line-height:1.1;margin:6px 0 2px}
.hero .sub{opacity:.95;font-weight:600}
.clock{background:var(--surface-2);border-radius:14px;padding:12px;text-align:center}
.clock .t{font-size:26px;font-weight:800}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 12px;border-radius:999px;background:var(--surface-2);font-weight:700;font-size:14px}
.chip.on{background:var(--accent);color:var(--accent-ink)}
.think{width:100%;padding:22px;border-radius:24px;font-size:20px;font-weight:800;background:var(--accent);color:var(--accent-ink);box-shadow:var(--shadow)}
.think:active{transform:scale(.97)}
.answer{background:var(--surface-2);border-radius:14px;padding:10px 12px;margin-top:8px}
.answer b{display:block;font-size:13px;color:var(--muted)}
/* Chat */
.chat{display:flex;flex-direction:column;gap:6px;padding-bottom:70px}
.msg{max-width:78%;padding:9px 13px;border-radius:18px;word-wrap:break-word;white-space:pre-wrap}
.msg.me{align-self:flex-end;background:var(--bubble-me);color:var(--bubble-me-ink);border-bottom-right-radius:6px}
.msg.you{align-self:flex-start;background:var(--bubble-you);color:var(--bubble-you-ink);border-bottom-left-radius:6px}
.msg .meta{font-size:11px;opacity:.75;margin-top:2px;text-align:right}
.daysep{align-self:center;font-size:12px;color:var(--muted);margin:8px 0}
.composer{position:fixed;left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom));z-index:5;display:flex;justify-content:center;background:var(--bg);padding:8px 16px}
.composer .in{display:flex;gap:8px;width:100%;max-width:528px}
.composer input{flex:1}
/* Listas */
.seg{display:flex;background:var(--surface-2);border-radius:14px;padding:4px;margin-bottom:12px}
.seg button{flex:1;padding:8px;border-radius:10px;font-weight:700;font-size:14px}
.seg button.on{background:var(--surface);box-shadow:var(--shadow)}
.item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .tx{flex:1;min-width:0}
.item.done .tx{text-decoration:line-through;color:var(--muted)}
.check{width:26px;height:26px;border-radius:8px;border:2px solid var(--accent);display:grid;place-items:center;flex:none;color:var(--accent-ink)}
.item.done .check{background:var(--accent)}
/* Juegos */
.game{display:flex;gap:14px;align-items:center}
.game .ic{font-size:40px;width:64px;height:64px;border-radius:18px;background:var(--surface-2);display:grid;place-items:center;flex:none}
.game h3{margin:0;font-size:17px}
/* Escape room */
.er-top{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.locks{display:flex;gap:4px;font-size:18px}
.timer{font-weight:800;font-variant-numeric:tabular-nums;background:var(--surface);padding:6px 10px;border-radius:10px}
.scene{position:relative;width:100%;aspect-ratio:3/4;max-height:62vh;border-radius:20px;overflow:hidden;box-shadow:var(--shadow);touch-action:pan-y;user-select:none;-webkit-user-select:none}
.scene .wall{position:absolute;inset:0 0 28% 0;background:linear-gradient(180deg,var(--wall),var(--wall-2))}
.scene .floor{position:absolute;inset:72% 0 0 0;background:linear-gradient(180deg,var(--floor),var(--floor-2))}
.scene .base{position:absolute;left:0;right:0;top:72%;height:6px;background:rgba(0,0,0,.18)}
.scene .label{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.35);color:#fff;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px}
.scene.lit .wall{background:linear-gradient(180deg,#fff2c9,var(--wall))}
.obj{position:absolute;transform:translate(-50%,-50%);font-size:calc(clamp(40px,13vw,64px) * var(--s,1));line-height:1;filter:drop-shadow(0 6px 6px rgba(0,0,0,.25));transition:transform .15s}
.obj:active{transform:translate(-50%,-50%) scale(.92)}
.obj.found::after{content:'';position:absolute;right:-4px;top:-4px;width:12px;height:12px;border-radius:50%;background:var(--ok);border:2px solid #fff}
.turn{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:64px;background:rgba(0,0,0,.28);color:#fff;font-size:26px;display:grid;place-items:center}
.turn.l{left:0;border-radius:0 14px 14px 0}.turn.r{right:0;border-radius:14px 0 0 14px}
.notes .n{padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.notes .n:last-child{border-bottom:0}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.keypad button{padding:14px;border-radius:14px;background:var(--surface-2);font-size:22px;font-weight:800}
.display{font-size:32px;letter-spacing:10px;text-align:center;font-weight:800;padding:10px;border-radius:14px;background:var(--surface-2);font-variant-numeric:tabular-nums;min-height:58px}
.swatches{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.swatches button{aspect-ratio:1;border-radius:16px;border:3px solid rgba(0,0,0,.1)}
.symbols{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.symbols button{padding:12px 4px;border-radius:14px;background:var(--surface-2);font-size:28px;display:flex;flex-direction:column;align-items:center;font-weight:700}
.symbols button small{font-size:12px}
.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
/* Hojas inferiores */
.sheet-bg{position:fixed;inset:0;background:rgba(20,8,12,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto;animation:up .2s ease-out}
.sheet h2{margin:0 0 6px;font-size:19px}
.sheet .closeup{font-size:64px;text-align:center;margin:6px 0}
@keyframes up{from{transform:translateY(40px);opacity:.5}to{transform:none;opacity:1}}
/* Llamada */
body.incall header.top{padding-top:calc(64px + env(safe-area-inset-top))}
.callbar{position:fixed;left:50%;transform:translateX(-50%);top:calc(8px + env(safe-area-inset-top));z-index:30;display:flex;align-items:center;gap:8px;background:var(--ok);color:#fff;padding:8px 10px 8px 14px;border-radius:999px;box-shadow:var(--shadow);font-weight:800;max-width:calc(100% - 32px)}
.callbar.ringing{background:var(--accent)}
.callbar button{background:rgba(255,255,255,.22);color:#fff;border-radius:999px;padding:6px 10px;font-weight:800}
.callbar button.end{background:var(--bad)}
/* Toque recibido */
.love{position:fixed;inset:0;z-index:40;pointer-events:none;display:grid;place-items:center}
.love .msgl{background:var(--surface);color:var(--text);padding:14px 20px;border-radius:20px;font-weight:800;box-shadow:var(--shadow);animation:pop 2.6s ease forwards}
.heart{position:fixed;bottom:-40px;font-size:34px;animation:rise 2.8s ease-in forwards}
@keyframes rise{to{transform:translateY(-110vh) rotate(25deg);opacity:0}}
@keyframes pop{0%{transform:scale(.6);opacity:0}15%{transform:scale(1.05);opacity:1}80%{opacity:1}100%{opacity:0}}
.toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:14px;z-index:50;font-weight:700;max-width:calc(100% - 32px)}
.banner{background:var(--surface-2);border-radius:14px;padding:10px 12px;font-size:13px;margin-bottom:12px}
.welcome{padding:calc(40px + env(safe-area-inset-top)) 20px 40px;max-width:480px;margin:0 auto}
.welcome .logo{font-size:64px;text-align:center}
.welcome h1{text-align:center;margin:6px 0 4px;font-size:30px}
.codebig{font-size:40px;font-weight:800;letter-spacing:8px;text-align:center;padding:14px;border-radius:16px;background:var(--surface-2);margin:10px 0}
/* Escape room 3D */
#e3{position:fixed;inset:0;z-index:15;background:#000;color:#fff;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
#e3 .e3-canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#e3.loading .e3-canvas{opacity:0}
.e3-top{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;background:linear-gradient(rgba(0,0,0,.6),transparent);pointer-events:none}
body.incall .e3-top{padding-top:calc(58px + env(safe-area-inset-top))}
.e3-top>*{pointer-events:auto}
.e3-btn{width:42px;height:42px;border-radius:50%;border:0;background:rgba(255,255,255,.16);color:#fff;font-size:18px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);cursor:pointer;flex:none}
.e3-title{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.2;text-shadow:0 1px 3px #000}
.e3-title b{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.e3-title span{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.e3-title span.urgent{color:#ff6b6b;animation:pulse 1s infinite}
.e3-danger{position:absolute;left:12px;right:12px;top:calc(68px + env(safe-area-inset-top));font-size:13px;font-weight:700;text-shadow:0 1px 3px #000;pointer-events:none}
body.incall .e3-danger{top:calc(116px + env(safe-area-inset-top))}
.e3-cross{position:absolute;left:50%;top:50%;width:8px;height:8px;margin:-4px 0 0 -4px;border-radius:50%;background:rgba(255,255,255,.85);box-shadow:0 0 0 2px rgba(0,0,0,.35);pointer-events:none}
.e3-prompt{position:absolute;left:50%;top:calc(50% + 18px);transform:translateX(-50%);background:rgba(0,0,0,.55);padding:6px 12px;border-radius:999px;font-size:13px;font-weight:700;white-space:nowrap;pointer-events:none}
.e3-joy{position:absolute;left:28px;bottom:calc(36px + env(safe-area-inset-bottom));width:120px;height:120px;border-radius:50%;border:2px solid rgba(255,255,255,.35);background:rgba(255,255,255,.08);pointer-events:none;opacity:.7}
.e3-joy.on{opacity:1}
.e3-knob{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.55)}
.e3-hint{position:absolute;right:16px;bottom:calc(40px + env(safe-area-inset-bottom));max-width:44%;font-size:12px;text-align:right;opacity:.75;text-shadow:0 1px 3px #000;pointer-events:none}
.e3-msg{position:absolute;left:50%;top:calc(110px + env(safe-area-inset-top));transform:translateX(-50%);width:min(92%,460px);background:rgba(15,10,12,.82);border:1px solid rgba(255,255,255,.15);padding:12px 16px;border-radius:16px;font-weight:700;text-align:center;line-height:1.35;pointer-events:none}
@media (hover:hover) and (pointer:fine){.e3-joy{display:none}}
@keyframes pulse{50%{opacity:.45}}
</style>
</head>
<body>
<div id="app"></div>
<audio id="remoteAudio" autoplay playsinline></audio>
<!--SCRIPTS-->
</body>
</html>
